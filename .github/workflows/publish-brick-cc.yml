name: Publish brick-cc images

# Builds the two images consumed by deploy/installers/windows/setup.ps1
# and publishes them to GHCR. Triggered on:
#   - git tag v*    → tags `:latest` and `:<version>`
#   - manual dispatch with `tag` input
#
# The images are amd64-only on purpose: the classifier needs cu121 wheels and
# the Windows installer targets amd64 hosts. Add arm64 only when there is a
# reproducible torch wheel story for it.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. dev, rc1)'
        required: true
        default: 'dev'

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: brick-cc-router
            context: .
            dockerfile: ./apps/router/Dockerfile
          - image: brick-cc-classifier
            context: ./deploy/addons/brick-complexity-server
            dockerfile: ./deploy/addons/brick-complexity-server/Dockerfile.gpu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: tags
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER_LC}/${{ matrix.image }}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
            echo "tags=${IMAGE}:latest,${IMAGE}:${VER}" >> "$GITHUB_OUTPUT"
          else
            VER="${{ inputs.tag }}"
            echo "tags=${IMAGE}:${VER}" >> "$GITHUB_OUTPUT"
          fi
          echo "first=${IMAGE}:${VER}" >> "$GITHUB_OUTPUT"

      - name: Free disk space (classifier image is large)
        if: matrix.image == 'brick-cc-classifier'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build image (load locally for scan)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Trivy scan (gate on fixable CRITICAL)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ steps.tags.outputs.first }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          timeout: 30m

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: ${{ matrix.image }}

      - name: Push image
        run: |
          for tag in $(echo "${{ steps.tags.outputs.tags }}" | tr ',' ' '); do
            echo "Pushing $tag"
            docker push "$tag"
          done
